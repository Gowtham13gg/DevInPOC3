spring.application.name=sf-lead-api

# Server Configuration
server.port=8080

# Database Configuration (Using H2 in-memory database for development)
spring.datasource.url=jdbc:h2:mem:sfleaddb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console Configuration (for development purposes)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.uno.bank=DEBUG
logging.level.org.springframework.security=DEBUG
logging.file.name=logs/sf-lead-api.log

# Security Configuration
spring.security.basic.enabled=false
management.security.enabled=false
security.basic.enabled=false
security.ignored=/**
spring.security.user.password=none

# Disable Spring Security auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# CORS Configuration
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
